name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/ChuA.PlatformCli/ChuA.PlatformCli.csproj --configuration Release

      - name: Test
        run: dotnet run --project tests/ChuA.PlatformCli.Tests/ChuA.PlatformCli.Tests.csproj --configuration Release
